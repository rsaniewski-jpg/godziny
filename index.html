<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Godziny">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="author" content="Rafał Saniewski">
<title>Godziny pracy</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #15171c; --muted: #6b7080;
    --line: #e3e5ea; --accent: #2f6fed; --on-accent: #ffffff;
    --stop: #d9453b; --live: #1f9d55; --field: #f4f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #eef0f4; --muted: #9097a6;
      --line: #2a2e37; --accent: #4c86ff; --on-accent: #ffffff;
      --stop: #ef5a50; --live: #3ccf7a; --field: #23262f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); font-weight: 400; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  .chip { display: block; margin: 0; color: var(--text); position: relative; flex: 0 0 auto; background: var(--card); border: 1px solid var(--line);
          border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .chip select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

  .hero { background: linear-gradient(135deg, #2f6fed, #5b8cff); color: #fff; border-radius: 22px; padding: 18px;
          display: grid; gap: 4px; box-shadow: 0 6px 18px rgba(47,111,237,.25); }
  .hero-month { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .hero .total { margin: 2px 0; }
  .hero-sub { font-size: 14px; opacity: .92; }
  .hero-sub:empty { display: none; }
  .hero .bar { background: rgba(255,255,255,.3); margin: 10px 0 6px; }
  .hero .bar-fill { background: #fff; }
  .hero .bar-fill.done { background: #b9f6cf; }
  .hero-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .hero .over { color: #fff; font-weight: 700; }
  .total { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 2px 0; }
  .sub { font-size: 14px; color: var(--muted); }

  .card { background: var(--card); border-radius: 18px; padding: 18px; }
  .norm { display: grid; gap: 10px; }
  .norm-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .norm .link { padding: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--field); overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .bar-fill.done { background: var(--live); }
  .over { color: var(--live); font-weight: 600; }
  .pay { border-top: 1px solid var(--line); padding-top: 10px; }
  #payNorm:empty { display: none; }
  .holidays { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .holidays:empty { display: none; }
  .now { display: grid; gap: 12px; }
  .now label { margin-bottom: 0; }
  .now-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .now-head .muted { font-size: 14px; }
  .preview { text-align: center; font-size: 15px; color: var(--muted); min-height: 21px; }
  .preview strong { color: var(--text); font-size: 20px; font-variant-numeric: tabular-nums; }
  .big { border: 0; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600;
         background: var(--accent); color: var(--on-accent); }
  .big.stop { background: var(--stop); }

  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h2 { font-size: 17px; margin: 0; }
  .link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 0; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .day { background: var(--card); border-radius: 14px; overflow: hidden; }
  .day-head { display: flex; justify-content: space-between; padding: 12px 14px 6px; font-weight: 600; }
  .entry { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
           border: 0; border-top: 1px solid var(--line); background: none; padding: 12px 14px;
           font-variant-numeric: tabular-nums; }
  .entry:first-of-type { border-top: 0; }
  .live { color: var(--live); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 24px; background: var(--card); border-radius: 14px; }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .backup-info { text-align: center; font-size: 13px; color: var(--muted); margin-top: -6px; }
  .backup-info.late { color: var(--stop); font-weight: 600; }
  #bdlg p { margin: 0 0 16px; color: var(--muted); }
  .author { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
  .tools button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 6px; font-size: 13px; }

  dialog { border: 0; border-radius: 18px; padding: 20px; width: min(420px, calc(100vw - 32px));
           background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 14px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  input { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
  [hidden] { display: none !important; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--field); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: none; border-radius: 9px; padding: 10px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .fields { display: grid; gap: 12px; }
  .tag { color: var(--accent); font-weight: 600; }
  .split { font-size: 14px; color: var(--muted); }
  .split:empty { display: none; }
  .tsel { display: flex; align-items: center; gap: 4px; }
  .tsel select { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--field);
                 border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; min-height: 44px;
                 text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none;
                 font-variant-numeric: tabular-nums; }
  .tsel span { color: var(--muted); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two > * { min-width: 0; }
  input[type=date] { min-width: 0; max-width: 100%; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-weight: 600; background: var(--field); }
  .actions .primary { background: var(--accent); color: var(--on-accent); }
  .actions .danger { background: none; color: var(--stop); flex: 0 0 auto; }
  .hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Moje godziny pracy</h1>
    <label class="chip">
      <span id="monthChip"></span> ▾
      <select id="monthSel" aria-label="Wybierz miesiąc"></select>
    </label>
  </header>

  <section class="hero">
    <div class="hero-month" id="heroMonth"></div>
    <div class="total" id="total"></div>
    <div class="hero-sub" id="days"></div>
    <div class="hero-sub" id="split"></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="hero-row">
      <span id="normLeft"></span>
      <span id="daysLeft"></span>
    </div>
  </section>

  <section class="card norm">
    <div class="norm-row">
      <span>Wymiar: <strong id="normText"></strong></span>
      <button class="link" id="setHours"></button>
    </div>
    <div class="norm-row pay">
      <span>Zarobek: <strong id="payText"></strong></span>
      <button class="link" id="setRate"></button>
    </div>
    <div class="norm-row sub" id="payNorm"></div>
    <div class="holidays" id="holidays"></div>
  </section>

  <section class="card now">
    <div class="now-head">
      <h2>Dodaj godziny</h2>
      <span class="muted" id="todayInfo"></span>
    </div>
    <div class="seg" role="tablist">
      <button data-mode="praca" class="on" role="tab">Praca</button>
      <button data-mode="urlop" role="tab">Urlop</button>
      <button data-mode="l4" role="tab">L4</button>
    </div>
    <div class="fields" id="workFields">
      <label>Data <input type="date" id="qDate"></label>
      <div class="two">
        <label>Start <div class="tsel" id="qStart"></div></label>
        <label>Koniec <div class="tsel" id="qEnd"></div></label>
      </div>
      <label>Przerwa (minuty) <input type="number" id="qBreak" min="0" step="5" inputmode="numeric"></label>
    </div>
    <div class="fields" id="vacFields" hidden>
      <div class="two">
        <label>Od <input type="date" id="vFrom"></label>
        <label>Do <input type="date" id="vTo"></label>
      </div>
      <label><span id="vHoursLbl">Godzin urlopu za dzień</span> <input type="number" id="vHours" min="0.5" max="24" step="0.5" inputmode="decimal"></label>
    </div>
    <div class="preview" id="qPreview"></div>
    <button class="big" id="qAdd">Dodaj wpis</button>
  </section>

  <section>
    <div class="row-head">
      <h2>Wpisy</h2>
    </div>
    <ul id="list"></ul>
  </section>

  <section class="tools">
    <button id="exportJson">Backup</button>
    <button id="importJson">Wczytaj backup</button>
    <button id="exportCsv">Eksport CSV</button>
    <input type="file" id="file" accept=".json,application/json,text/plain" hidden>
  </section>

  <div class="backup-info" id="backupInfo"></div>

  <footer class="author">Autor: Rafał Saniewski · 2026</footer>
</main>

<dialog id="bdlg">
  <h3>Czas na backup 💾</h3>
  <p id="bmsg"></p>
  <div class="actions">
    <button id="bLater">Później</button>
    <button class="primary" id="bNow" autofocus>Zrób backup</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3 id="dlgTitle">Nowy wpis</h3>
  <label>Data <input type="date" id="fDate"></label>
  <div class="two" id="fTimes">
    <label>Start <div class="tsel" id="fStart"></div></label>
    <label>Koniec <div class="tsel" id="fEnd"></div></label>
  </div>
  <div class="hint" id="endHint"></div>
  <label id="fBreakWrap">Przerwa (minuty) <input type="number" id="fBreak" min="0" step="5" inputmode="numeric"></label>
  <label id="fHoursWrap" hidden>Liczba godzin <input type="number" id="fHours" min="0.5" max="24" step="0.5" inputmode="decimal"></label>
  <div class="actions">
    <button class="danger" id="del">Usuń</button>
    <button id="cancel">Anuluj</button>
    <button class="primary" id="saveBtn">Zapisz</button>
  </div>
</dialog>

<script>
const KEY = "godziny-pracy-v1"
const MONTHS = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"]
const DAYS = ["nd","pn","wt","śr","cz","pt","sb"]
const $ = id => document.getElementById(id)

// Rodzaje nieobecności liczonych do wymiaru
const ABS = {
  urlop: { label: "Urlop", icon: "🌴", gen: "urlopu", paid: true },
  l4:    { label: "L4",    icon: "🤒", gen: "L4",     paid: false }
}

// ---------- Dane ----------
function normalize(arr) {
  if (!Array.isArray(arr)) throw new Error("not array")
  return arr
    .filter(e => e && !isNaN(new Date(e.start)))
    .map(e => ({
      start: new Date(e.start).toISOString(),
      end: e.end && !isNaN(new Date(e.end)) ? new Date(e.end).toISOString() : null,
      breakMin: Math.max(0, parseInt(e.breakMin) || 0),
      ...(ABS[e.type] ? { type: e.type } : {})
    }))
}

function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY)) || []) } catch { return [] }
}

let data = load()
let view = monthStart(new Date())

function save() {
  data.sort((a, b) => new Date(a.start) - new Date(b.start))
  try { localStorage.setItem(KEY, JSON.stringify(data)) }
  catch { alert("Nie udało się zapisać danych na tym urządzeniu.") }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist() } catch {}
  render()
}

// ---------- Pomocnicze ----------
const pad = n => String(n).padStart(2, "0")
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
const fmtHours = h => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}:${pad(m % 60)}` }
const fmtElapsed = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` }
const decimal = h => h.toFixed(2).replace(".", ",")
const money = v => new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN" }).format(v)
function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1) }

function entryHours(e) {
  const end = e.end ? new Date(e.end) : new Date()
  return Math.max(0, (end - new Date(e.start)) / 3600000 - (e.breakMin || 0) / 60)
}
const openEntry = () => data.find(e => !e.end)
function inMonth(e, y, m) { const d = new Date(e.start); return d.getFullYear() === y && d.getMonth() === m }
function makeDate(dateStr, timeStr) {
  const [y, mo, d] = dateStr.split("-").map(Number)
  const [h, mi] = timeStr.split(":").map(Number)
  return new Date(y, mo - 1, d, h, mi || 0)
}
const daysLabel = n => n === 1 ? "dzień" : "dni"

// ---------- Wybór godziny (zamiast systemowego zegara) ----------
function makeTimeSelect(id, optional) {
  const box = $(id)
  const h = document.createElement("select"), m = document.createElement("select")
  h.setAttribute("aria-label", "Godzina")
  m.setAttribute("aria-label", "Minuty")
  if (optional) { h.add(new Option("--", "")); m.add(new Option("--", "")) }
  for (let i = 0; i < 24; i++) h.add(new Option(pad(i), pad(i)))
  for (let i = 0; i < 60; i += 5) m.add(new Option(pad(i), pad(i)))
  const sep = document.createElement("span")
  sep.textContent = ":"
  box.append(h, sep, m)
  const fire = () => box.dispatchEvent(new Event("input"))
  h.onchange = () => { if (optional) { if (h.value && !m.value) m.value = "00"; if (!h.value) m.value = "" } fire() }
  m.onchange = () => { if (optional) { if (m.value && !h.value) h.value = "08"; if (!m.value) h.value = "" } fire() }
  Object.defineProperty(box, "value", {
    get: () => (h.value && m.value ? `${h.value}:${m.value}` : ""),
    set: v => {
      const [hh, mm] = String(v || "").split(":")
      if (!hh || !mm) { if (optional) { h.value = ""; m.value = "" } return }
      if (![...m.options].some(o => o.value === mm)) { // np. 07:43 z wcześniejszego wpisu
        const before = [...m.options].find(o => o.value && o.value > mm)
        m.add(new Option(mm, mm), before || null)
      }
      h.value = hh
      m.value = mm
    }
  })
}
makeTimeSelect("qStart")
makeTimeSelect("qEnd")
makeTimeSelect("fStart")
makeTimeSelect("fEnd", true)

// ---------- Ustawienia ----------
const SKEY = KEY + "-settings"
let settings = { hoursPerDay: 8 }
try { Object.assign(settings, JSON.parse(localStorage.getItem(SKEY)) || {}) } catch {}
function saveSettings() { try { localStorage.setItem(SKEY, JSON.stringify(settings)) } catch {} }

// ---------- Święta w Polsce ----------
function easter(y) { // algorytm Gaussa / Meeusa
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3)
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451)
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1
  return new Date(y, month - 1, day)
}
const holidayCache = {}
function holidays(y) {
  if (holidayCache[y]) return holidayCache[y]
  const e = easter(y)
  const plus = n => new Date(e.getFullYear(), e.getMonth(), e.getDate() + n)
  const list = [
    [new Date(y, 0, 1), "Nowy Rok"],
    [new Date(y, 0, 6), "Trzech Króli"],
    [e, "Wielkanoc"],
    [plus(1), "Poniedziałek Wielkanocny"],
    [new Date(y, 4, 1), "Święto Pracy"],
    [new Date(y, 4, 3), "Święto Konstytucji 3 Maja"],
    [plus(49), "Zielone Świątki"],
    [plus(60), "Boże Ciało"],
    [new Date(y, 7, 15), "Wniebowzięcie NMP"],
    [new Date(y, 10, 1), "Wszystkich Świętych"],
    [new Date(y, 10, 11), "Święto Niepodległości"],
    [new Date(y, 11, 25), "Boże Narodzenie"],
    [new Date(y, 11, 26), "Drugi dzień Bożego Narodzenia"]
  ]
  if (y >= 2025) list.push([new Date(y, 11, 24), "Wigilia"])
  return (holidayCache[y] = new Map(list.map(([d, n]) => [isoDate(d), n])))
}

// Wymiar czasu pracy: dni Pn–Pt bez świąt, minus 1 dzień za każde święto w sobotę (art. 130 § 2 KP)
function monthNorm(y, m) {
  const hol = holidays(y)
  const today = isoDate(new Date())
  let workDays = 0, satHolidays = 0, leftDays = 0
  const list = []
  const last = new Date(y, m + 1, 0).getDate()
  for (let d = 1; d <= last; d++) {
    const date = new Date(y, m, d), key = isoDate(date), wd = date.getDay()
    const name = hol.get(key)
    if (name) list.push({ d, wd, name })
    if (name && wd === 6) satHolidays++
    if (wd >= 1 && wd <= 5 && !name) {
      workDays++
      if (key >= today) leftDays++
    }
  }
  const normDays = workDays - satHolidays
  return { normDays, workDays, satHolidays, leftDays, holidays: list, normHours: normDays * settings.hoursPerDay }
}

// ---------- Widok ----------
function render() {
  const y = view.getFullYear(), m = view.getMonth()
  const entries = data.filter(e => inMonth(e, y, m))
  const byDay = new Map()
  for (const e of entries) {
    const d = new Date(e.start).getDate()
    if (!byDay.has(d)) byDay.set(d, [])
    byDay.get(d).push(e)
  }
  const total = entries.reduce((s, e) => s + entryHours(e), 0)

  renderMonthSel()
  if (typeof renderBackupInfo === "function") renderBackupInfo()
  $("total").textContent = `${fmtHours(total)} h`
  const hOf = t => entries.filter(e => e.type === t).reduce((s, e) => s + entryHours(e), 0)
  const absParts = Object.keys(ABS).map(t => [t, hOf(t)]).filter(([, h]) => h > 0)
  const absTotal = absParts.reduce((s, [, h]) => s + h, 0)
  $("split").textContent = absParts.length
    ? [`Praca ${fmtHours(total - absTotal)} h`, ...absParts.map(([t, h]) => `${ABS[t].label} ${fmtHours(h)} h`)].join(" · ")
    : ""
  const paidHours = total - absParts.filter(([t]) => !ABS[t].paid).reduce((s, [, h]) => s + h, 0)
  const norm = monthNorm(y, m)
  $("days").textContent = `z ${fmtHours(norm.normHours)} h · ${byDay.size} z ${norm.normDays} dni`
  $("heroMonth").textContent = `${MONTHS[m]} ${y}`
  renderNorm(norm, total, paidHours)

  const list = $("list")
  list.innerHTML = ""
  if (!entries.length) {
    list.innerHTML = '<li class="empty">Brak wpisów w tym miesiącu</li>'
  }
  for (const d of [...byDay.keys()].sort((a, b) => b - a)) {
    const items = byDay.get(d)
    const sum = items.reduce((s, e) => s + entryHours(e), 0)
    const li = document.createElement("li")
    li.className = "day"
    li.innerHTML = `<div class="day-head"><span>${pad(d)}.${pad(m + 1)} <span class="muted">${DAYS[new Date(y, m, d).getDay()]}</span></span><span>${fmtHours(sum)} h</span></div>`
    for (const e of items) {
      const s = new Date(e.start)
      const b = document.createElement("button")
      b.className = "entry"
      b.innerHTML = isAbs(e)
        ? `<span class="tag">${ABS[e.type].icon} ${ABS[e.type].label}</span><span>${fmtHours(entryHours(e))}</span>`
        : `<span>${hhmm(s)} – ${e.end ? hhmm(new Date(e.end)) : '<span class="live">trwa</span>'}` +
          (e.breakMin ? ` <span class="muted">· przerwa ${e.breakMin} min</span>` : "") +
          `</span><span>${fmtHours(entryHours(e))}</span>`
      b.onclick = () => openDialog(e)
      li.appendChild(b)
    }
    list.appendChild(li)
  }
  renderStatus()
}

function renderNorm(norm, total, paidHours = total) {
  $("normText").textContent = `${norm.normDays} ${daysLabel(norm.normDays)} · ${fmtHours(norm.normHours)} h`
  $("setHours").textContent = `${String(settings.hoursPerDay).replace(".", ",")} h/dzień ✎`
  const pct = norm.normHours ? Math.min(100, total / norm.normHours * 100) : 0
  $("barFill").style.width = pct + "%"
  $("barFill").classList.toggle("done", total >= norm.normHours && norm.normHours > 0)

  const diff = total - norm.normHours
  const left = $("normLeft")
  if (diff >= 0 && norm.normHours > 0) {
    left.textContent = diff > 0 ? `Nadgodziny: +${fmtHours(diff)} h` : "Wymiar wyrobiony ✓"
    left.className = "over"
  } else {
    left.textContent = `Brakuje: ${fmtHours(-diff)} h`
    left.className = ""
  }
  $("daysLeft").textContent = norm.leftDays ? `Zostało ${norm.leftDays} ${daysLabel(norm.leftDays)}` : ""

  const parts = norm.holidays.map(h => `${pad(h.d)}.${pad(view.getMonth() + 1)} (${DAYS[h.wd]}) ${h.name}`)
  let txt = parts.length ? "Święta: " + parts.join(" · ") : ""
  if (norm.satHolidays) txt += ` — święto w sobotę obniża wymiar o ${norm.satHolidays * settings.hoursPerDay} h (pracodawca wyznacza inny dzień wolny)`
  $("holidays").textContent = txt

  const rate = settings.rate || 0
  $("setRate").textContent = rate ? `${money(rate)}/h ✎` : "Ustaw stawkę ✎"
  $("payText").textContent = rate ? money(paidHours * rate) + (paidHours < total ? " (bez L4)" : "") : "—"
  $("payNorm").textContent = rate && norm.normHours
    ? `Za pełny wymiar (${fmtHours(norm.normHours)} h): ${money(norm.normHours * rate)}`
    : ""
}

$("setRate").onclick = () => {
  const cur = settings.rate ? String(settings.rate).replace(".", ",") : ""
  const v = prompt("Stawka za godzinę w zł (np. 30,50). Zostaw puste, aby usunąć.", cur)
  if (v === null) return
  if (v.trim() === "") { settings.rate = 0 }
  else {
    const n = parseFloat(v.replace(/\s/g, "").replace(",", "."))
    if (!(n > 0 && n < 100000)) return alert("Podaj poprawną kwotę, np. 30,50.")
    settings.rate = Math.round(n * 100) / 100
  }
  saveSettings()
  render()
}

$("setHours").onclick = () => {
  const v = prompt("Ile godzin dziennie wynosi Twój etat? (np. 8, 7, 4)", String(settings.hoursPerDay))
  if (v === null) return
  const n = parseFloat(v.replace(",", "."))
  if (!(n > 0 && n <= 24)) return alert("Podaj liczbę od 1 do 24.")
  settings.hoursPerDay = n
  saveSettings()
  render()
}

function renderStatus() {
  const today = isoDate(new Date())
  const t = data.filter(e => isoDate(new Date(e.start)) === today).reduce((s, e) => s + entryHours(e), 0)
  $("todayInfo").textContent = `Dziś: ${fmtHours(t)} h`
}

// ---------- Szybkie dodawanie ----------
function buildEntry(date, st, en, br) {
  if (!date || !st || !en) return null
  const start = makeDate(date, st), end = makeDate(date, en)
  if (isNaN(start) || isNaN(end)) return null
  if (end <= start) end.setDate(end.getDate() + 1) // zmiana nocna
  return { start: start.toISOString(), end: end.toISOString(), breakMin: Math.max(0, parseInt(br) || 0) }
}

function quickEntry() {
  return buildEntry($("qDate").value, $("qStart").value, $("qEnd").value, $("qBreak").value)
}

const isAbs = e => !!ABS[e.type]
let mode = "praca"

function absEntry(d, h, type) {
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate())
  return { type, start: s.toISOString(), end: new Date(s.getTime() + h * 3600000).toISOString(), breakMin: 0 }
}

function vacationDays() {
  const a = $("vFrom").value, b = $("vTo").value || a
  if (!a) return null
  const d = makeDate(a, "00:00"), end = makeDate(b, "00:00")
  if (isNaN(d) || isNaN(end) || end < d) return null
  const days = []
  for (let guard = 0; d <= end && guard < 400; guard++) {
    const wd = d.getDay()
    if (wd >= 1 && wd <= 5 && !holidays(d.getFullYear()).has(isoDate(d))) days.push(new Date(d))
    d.setDate(d.getDate() + 1)
  }
  return days
}
const vacHours = () => parseFloat(String($("vHours").value).replace(",", ".")) || 0

function setMode(mm) {
  mode = mm
  for (const b of document.querySelectorAll(".seg button")) b.classList.toggle("on", b.dataset.mode === mm)
  $("workFields").hidden = mm !== "praca"
  $("vacFields").hidden = !ABS[mm]
  if (ABS[mm]) $("vHoursLbl").textContent = `Godzin ${ABS[mm].gen} za dzień`
  $("qAdd").textContent = addLabel()
  updatePreview()
}
for (const b of document.querySelectorAll(".seg button")) b.onclick = () => setMode(b.dataset.mode)

const addLabel = () => mode === "praca" ? "Dodaj wpis" : `Dodaj ${ABS[mode].label === "L4" ? "L4" : "urlop"}`

function updatePreview() {
  if (ABS[mode]) {
    const days = vacationDays(), h = vacHours(), p = $("qPreview")
    if (!days) { p.textContent = ""; return }
    p.innerHTML = days.length
      ? `<strong>${days.length} ${daysLabel(days.length)}</strong> roboczych · ${fmtHours(days.length * h)} h <span class="muted">(bez weekendów i świąt)</span>`
      : "Brak dni roboczych w tym okresie"
    return
  }
  const e = quickEntry()
  const p = $("qPreview")
  if (!e) { p.textContent = ""; return }
  const night = new Date(e.end).getDate() !== new Date(e.start).getDate()
  p.innerHTML = `Razem: <strong>${fmtHours(entryHours(e))} h</strong>` + (night ? " · zmiana nocna" : "")
}

function initQuickForm() {
  $("qDate").value = isoDate(new Date())
  $("qStart").value = settings.lastStart || "08:00"
  $("qEnd").value = settings.lastEnd || "16:00"
  $("qBreak").value = settings.lastBreak ?? 0
  $("vFrom").value = $("vTo").value = isoDate(new Date())
  $("vHours").value = settings.hoursPerDay
  updatePreview()
}

for (const id of ["qDate", "qStart", "qEnd", "qBreak", "vFrom", "vTo", "vHours"]) $(id).addEventListener("input", updatePreview)
$("vFrom").addEventListener("change", () => {
  if (!$("vTo").value || $("vTo").value < $("vFrom").value) $("vTo").value = $("vFrom").value
  updatePreview()
})

function flashAdded() {
  const b = $("qAdd")
  b.textContent = "Dodano ✓"
  setTimeout(() => { b.textContent = addLabel() }, 1200)
}

function addVacation() {
  const days = vacationDays(), h = vacHours()
  if (!days || !days.length) return alert("Wybierz okres, w którym są dni robocze.")
  if (!(h > 0 && h <= 24)) return alert("Podaj liczbę godzin na dzień (np. 8).")
  const type = mode
  let added = 0, skipped = 0
  for (const d of days) {
    const key = isoDate(d)
    if (data.some(x => isAbs(x) && isoDate(new Date(x.start)) === key)) { skipped++; continue }
    data.push(absEntry(d, h, type))
    added++
  }
  view = monthStart(days[0])
  save()
  flashAdded()
  if (skipped) alert(`Dodano ${added} ${daysLabel(added)} ${ABS[type].gen}. Pominięto ${skipped === 1 ? "1 dzień, który miał" : skipped + " dni, które miały"} już wpisany urlop lub L4.`)
}

$("qAdd").onclick = () => {
  if (ABS[mode]) return addVacation()
  const e = quickEntry()
  if (!e) return alert("Uzupełnij datę oraz godzinę rozpoczęcia i zakończenia.")
  const day = $("qDate").value
  const same = data.filter(x => isoDate(new Date(x.start)) === day)
  if (same.length) {
    const txt = same.map(x => isAbs(x) ? ABS[x.type].label : `${hhmm(new Date(x.start))}–${x.end ? hhmm(new Date(x.end)) : "?"}`).join(", ")
    if (!confirm(`Ten dzień ma już wpis (${txt}). Dodać kolejny?`)) return
  }
  data.push(e)
  settings.lastStart = $("qStart").value
  settings.lastEnd = $("qEnd").value
  settings.lastBreak = parseInt($("qBreak").value) || 0
  saveSettings()
  view = monthStart(new Date(e.start))
  save()
  flashAdded()
}

// ---------- Lista miesięcy ----------
function monthHours(y, m) { return data.filter(e => inMonth(e, y, m)).reduce((s, e) => s + entryHours(e), 0) }
const monthIdx = d => d.getFullYear() * 12 + d.getMonth()

function renderMonthSel() {
  const cur = monthIdx(new Date())
  const used = new Set(data.map(e => monthIdx(new Date(e.start))))
  used.add(monthIdx(view))
  const label = i => {
    const y = Math.floor(i / 12), m = i % 12
    return `${MONTHS[m]} ${y} (${fmtHours(monthHours(y, m))} h)` + (i === cur ? " · bieżący" : "")
  }
  const sel = $("monthSel")
  sel.innerHTML = ""
  // bieżący miesiąc; następny pojawia się na 3 dni przed końcem bieżącego
  // (dalsze miesiące tylko wtedy, gdy mają już wpisy, np. zaplanowany urlop)
  const today = new Date()
  const daysToEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() - today.getDate()
  const ahead = [cur]
  if (daysToEnd <= 3) ahead.push(cur + 1)
  for (const i of used) if (i > cur && !ahead.includes(i)) ahead.push(i)
  const g = document.createElement("optgroup")
  g.label = ahead.length > 1 ? "Bieżący i kolejne" : "Bieżący"
  for (const i of ahead.sort((a, b) => a - b)) g.appendChild(new Option(label(i), String(i)))
  sel.appendChild(g)
  // wcześniejsze: poprzedni miesiąc i wszystkie z wpisami
  const past = [...used].filter(i => i < cur)
  if (!past.includes(cur - 1)) past.push(cur - 1)
  const back = document.createElement("optgroup")
  back.label = "Wcześniejsze"
  for (const i of past.sort((a, b) => b - a)) back.appendChild(new Option(label(i), String(i)))
  sel.appendChild(back)
  sel.value = String(monthIdx(view))
  $("monthChip").textContent = MONTHS[view.getMonth()] + (view.getFullYear() !== new Date().getFullYear() ? " " + view.getFullYear() : "")
}

$("monthSel").onchange = ev => {
  const i = parseInt(ev.target.value)
  view = new Date(Math.floor(i / 12), i % 12, 1)
  render()
}

// ---------- Dodawanie / edycja ----------
let editing = null
function openDialog(e) {
  editing = e || null
  const s = e ? new Date(e.start) : new Date()
  $("dlgTitle").textContent = e ? "Edytuj wpis" : "Nowy wpis"
  $("fDate").value = isoDate(s)
  $("fStart").value = e ? hhmm(s) : "08:00"
  $("fEnd").value = e ? (e.end ? hhmm(new Date(e.end)) : "") : "16:00"
  $("fBreak").value = e ? e.breakMin : 0
  const vac = !!(e && isAbs(e))
  $("fTimes").hidden = $("fBreakWrap").hidden = $("endHint").hidden = vac
  $("fHoursWrap").hidden = !vac
  if (vac) {
    $("dlgTitle").textContent = `Edytuj: ${ABS[e.type].label}`
    $("fHours").value = Math.round(entryHours(e) * 100) / 100
  }
  $("endHint").textContent = e && !e.end ? "Zostaw koniec pusty, jeśli praca dalej trwa." : "Koniec wcześniej niż start = zmiana nocna."
  $("del").hidden = !e
  $("dlg").showModal()
}

$("cancel").onclick = () => $("dlg").close()

$("saveBtn").onclick = () => {
  if (editing && isAbs(editing)) {
    const date = $("fDate").value, h = parseFloat(String($("fHours").value).replace(",", ".")) || 0
    if (!date || !(h > 0 && h <= 24)) return alert("Podaj datę i liczbę godzin.")
    Object.assign(editing, absEntry(makeDate(date, "00:00"), h, editing.type))
    view = monthStart(makeDate(date, "00:00"))
    $("dlg").close()
    return save()
  }
  const date = $("fDate").value, st = $("fStart").value, en = $("fEnd").value
  if (!date || !st) return alert("Podaj datę i godzinę rozpoczęcia.")
  const start = makeDate(date, st)
  let end = null
  if (en) {
    end = makeDate(date, en)
    if (end <= start) end.setDate(end.getDate() + 1)
  } else if (!(editing && !editing.end)) {
    return alert("Podaj godzinę zakończenia.")
  }
  const entry = {
    start: start.toISOString(),
    end: end ? end.toISOString() : null,
    breakMin: Math.max(0, parseInt($("fBreak").value) || 0)
  }
  if (editing) Object.assign(editing, entry)
  else data.push(entry)
  view = monthStart(start)
  $("dlg").close()
  save()
}

$("del").onclick = () => {
  if (!editing || !confirm("Usunąć ten wpis?")) return
  data.splice(data.indexOf(editing), 1)
  $("dlg").close()
  save()
}

// ---------- Backup i eksport ----------
async function shareFile(name, text, type) {
  const file = new File([text], name, { type })
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true }
    catch (e) { if (e.name === "AbortError") return false }
  }
  const url = URL.createObjectURL(file)
  const a = document.createElement("a")
  a.href = url; a.download = name
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 2000)
  return true
}

// ---------- Backup co 7 dni ----------
// Backup tygodniowy: przypomnienie w niedzielę (podsumowanie tygodnia pn–nd).
// Jeśli niedziela minie bez backupu, aplikacja przypomni przy najbliższym otwarciu.
function lastSunday() {
  const d = new Date()
  d.setHours(0, 0, 0, 0)
  d.setDate(d.getDate() - d.getDay())   // getDay(): 0 = niedziela
  return d
}
const BACKUP_NAME = "godziny-pracy-backup.json"
const DAY_MS = 86400000

async function doBackup() {
  const ok = await shareFile(BACKUP_NAME, JSON.stringify(data, null, 2), "text/plain")
  if (ok) {
    settings.lastBackup = new Date().toISOString()
    delete settings.backupSnooze
    saveSettings()
    renderBackupInfo()
  }
  return ok
}

function backupDue() {
  if (!data.length) return false
  const now = Date.now()
  if (settings.backupSnooze && now < new Date(settings.backupSnooze).getTime()) return false
  if (!settings.lastBackup && !settings.backupBase) {        // pierwszy raz z danymi: odliczaj od dziś
    settings.backupBase = new Date().toISOString()
    saveSettings()
  }
  const since = new Date(settings.lastBackup || settings.backupBase).getTime()
  return since < lastSunday().getTime()
}

function renderBackupInfo() {
  const el = $("backupInfo")
  if (!settings.lastBackup) {
    el.textContent = data.length ? "Nie zrobiono jeszcze backupu" : ""
    el.className = "backup-info" + (data.length ? " late" : "")
    return
  }
  const d = new Date(settings.lastBackup)
  const midnight = x => { const t = new Date(x); t.setHours(0, 0, 0, 0); return t.getTime() }
  const days = Math.round((midnight(Date.now()) - midnight(d)) / DAY_MS)   // dni kalendarzowe
  el.textContent = `Ostatni backup: ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}` +
    (days >= 1 ? ` (${days} ${days === 1 ? "dzień" : "dni"} temu)` : " (dziś)")
  el.className = "backup-info" + (d < lastSunday() ? " late" : "")
}

function checkBackup() {
  renderBackupInfo()
  if (!backupDue() || $("bdlg").open || $("dlg").open) return
  const last = settings.lastBackup ? new Date(settings.lastBackup) : null
  const sunday = new Date().getDay() === 0
  $("bmsg").textContent = last
    ? `${sunday ? "Niedziela, koniec tygodnia (pn–nd)." : "Niedzielny backup nie został zrobiony."} Ostatni backup był ${Math.floor((Date.now() - last.getTime()) / DAY_MS)} dni temu. Zapisz plik „${BACKUP_NAME}” w tym samym miejscu co poprzednio (np. iCloud Drive lub Dysk Google) i wybierz „Zastąp”.`
    : `Twoje godziny są zapisane tylko w tym telefonie. Zapisz kopię „${BACKUP_NAME}” np. na iCloud Drive, Dysku Google albo wyślij ją sobie mailem.`
  $("bdlg").showModal()
}

$("bNow").onclick = async () => {
  if (await doBackup()) $("bdlg").close()
}
$("bLater").onclick = () => {
  settings.backupSnooze = new Date(Date.now() + DAY_MS).toISOString()   // przypomnij jutro
  saveSettings()
  $("bdlg").close()
}

$("exportJson").onclick = () => doBackup()

$("importJson").onclick = () => $("file").click()
$("file").onchange = async ev => {
  const f = ev.target.files[0]
  ev.target.value = ""
  if (!f) return
  try {
    const arr = normalize(JSON.parse(await f.text()))
    if (!arr.length) throw new Error("empty")
    if (confirm(`Wczytać ${arr.length} wpisów? Obecne dane zostaną zastąpione.`)) { data = arr; save() }
  } catch {
    alert("To nie jest poprawny plik backupu.")
  }
}

$("exportCsv").onclick = () => {
  const y = view.getFullYear(), m = view.getMonth()
  const entries = data.filter(e => inMonth(e, y, m))
  const rate = settings.rate || 0
  const rows = [["Data", "Rodzaj", "Start", "Koniec", "Przerwa (min)", "Godziny"].concat(rate ? ["Kwota (zł)"] : [])]
  for (const e of entries) {
    const s = new Date(e.start)
    const v = isAbs(e)
    const paid = !v || ABS[e.type].paid
    rows.push([isoDate(s), v ? ABS[e.type].label : "Praca", v ? "" : hhmm(s), v || !e.end ? "" : hhmm(new Date(e.end)), v ? "" : e.breakMin, decimal(entryHours(e))]
      .concat(rate ? [paid ? decimal(entryHours(e) * rate) : ""] : []))
  }
  const sumH = entries.reduce((s, e) => s + entryHours(e), 0)
  const paidH = entries.filter(e => !isAbs(e) || ABS[e.type].paid).reduce((s, e) => s + entryHours(e), 0)
  rows.push(["", "", "", "", "Suma", decimal(sumH)].concat(rate ? [decimal(paidH * rate)] : []))
  if (rate) rows.push(["", "", "", "", "Stawka (zł/h)", "", decimal(rate)])
  const csv = "﻿" + rows.map(r => r.join(";")).join("\r\n")
  shareFile(`godziny-${y}-${pad(m + 1)}.csv`, csv, "text/csv")
}

// ---------- Odświeżanie i offline ----------
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); checkBackup() } })

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {})
}

initQuickForm()
render()
setTimeout(checkBackup, 800)
</script>
